<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Hospital Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<div class="login-container">
    <h1>Hospital Management System</h1>
    <h2>Secure Login</h2>

    <div th:if="${param.error}" class="alert alert-error">
        Invalid username or password. Account may be locked after 5 failed attempts.
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
        You have been logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required
                   autocomplete="username" maxlength="50"
                   pattern="[a-zA-Z0-9._\-]+" title="Letters, digits, dots, underscores, hyphens only">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required
                   autocomplete="current-password" maxlength="100">
        </div>
        <button type="submit" class="btn-primary">Login</button>
    </form>
</div>
</body>
</html>
