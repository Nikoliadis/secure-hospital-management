<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <h1>My Profile</h1>
    <table class="detail-table">
        <tr><th>Username</th><td th:text="${user.username}"></td></tr>
        <tr><th>Email</th><td th:text="${user.email}"></td></tr>
        <tr><th>Role</th><td th:text="${user.role}"></td></tr>
        <tr><th>Last Password Change</th>
            <td th:text="${user.lastPasswordChange != null ? #temporals.format(user.lastPasswordChange,'dd/MM/yyyy HH:mm') : 'N/A'}"></td>
        </tr>
    </table>

    <h2>Change Password</h2>
    <p class="hint">Password must be at least 8 characters with uppercase, lowercase, digit, and special character.</p>
    <form th:action="@{/profile/change-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="form-group">
            <label>Current Password</label>
            <input type="password" name="currentPassword" required autocomplete="current-password">
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="newPassword" required autocomplete="new-password" minlength="8">
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirmPassword" required autocomplete="new-password" minlength="8">
        </div>
        <button type="submit" class="btn-primary">Change Password</button>
    </form>
</div>
</body>
</html>
