<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <th:block th:replace="~{layout :: favicon}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <div class="page-header">
        <h1>Edit User: <span th:text="${user.username}"></span></h1>
    </div>

    <form th:action="@{/admin/users/{id}/edit(id=${user.id})}" th:object="${form}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label>Username</label>
            <input type="text" th:value="${user.username}" disabled class="input-disabled">
            <small class="hint">Username cannot be changed</small>
        </div>

        <div class="form-group">
            <label>Email *</label>
            <input type="email" th:field="*{email}" required maxlength="100">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label>Role *</label>
            <select th:field="*{role}" required>
                <option th:each="role : ${roles}"
                        th:value="${role}"
                        th:text="${role}">
                </option>
            </select>
            <span class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></span>
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" th:field="*{enabled}">
                Account Enabled
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Save Changes</button>
            <a th:href="@{/admin/users}" class="btn-secondary">Cancel</a>
        </div>
    </form>

    <hr style="margin: 32px 0; border-color: #eee;">

    <h2>Reset Password</h2>
    <p class="hint" style="margin-bottom:16px">Min 8 chars, uppercase, lowercase, digit and special character (@$!%*?&_#-)</p>
    <form th:action="@{/admin/users/{id}/reset-password(id=${user.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="form-group" style="max-width:400px">
            <label>New Password</label>
            <input type="password" name="newPassword" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary"
                onclick="return confirm('Reset password for this user?')">
            Reset Password
        </button>
    </form>
</div>
</body>
</html>
