<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New User</title>
    <th:block th:replace="~{layout :: favicon}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <h1>Create New User</h1>
    <p class="hint" style="margin-bottom:20px">
        Only administrators can create user accounts. Users cannot self-register.
    </p>

    <form th:action="@{/admin/users/new}" th:object="${form}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label>Username *</label>
            <input type="text" th:field="*{username}" required
                   minlength="3" maxlength="50"
                   pattern="[a-zA-Z0-9._\-]+"
                   title="Letters, digits, dots, underscores, hyphens only"
                   autocomplete="off">
            <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>

        <div class="form-group">
            <label>Email *</label>
            <input type="email" th:field="*{email}" required maxlength="100" autocomplete="off">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label>Password *</label>
            <input type="password" th:field="*{password}" required minlength="8" autocomplete="new-password">
            <small class="hint">Min 8 chars, uppercase, lowercase, digit and special character (@$!%*?&_#-)</small>
            <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <div class="form-group">
            <label>Role *</label>
            <select th:field="*{role}" required>
                <option value="">-- Select Role --</option>
                <option th:each="role : ${roles}"
                        th:value="${role}"
                        th:text="${role}">
                </option>
            </select>
            <span class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></span>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Create User</button>
            <a th:href="@{/admin/users}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
