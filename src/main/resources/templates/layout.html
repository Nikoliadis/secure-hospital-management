<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/site.webmanifest}">
    <link rel="shortcut icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<th:block th:fragment="favicon">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/site.webmanifest}">
    <link rel="shortcut icon" th:href="@{/favicon.ico}">
</th:block>
<body>
<nav th:fragment="nav">
    <div class="nav-brand">Hospital Management System</div>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/patients}" sec:authorize="hasAnyRole('ADMIN','SECRETARIAT')">Patients</a>
        <a th:href="@{/doctors}" sec:authorize="hasAnyRole('ADMIN','SECRETARIAT')">Doctors</a>
        <a th:href="@{/visits}">Visits</a>
        <a th:href="@{/admin/users}" sec:authorize="hasRole('ADMIN')">Users</a>
        <a th:href="@{/profile}">Profile</a>
        &nbsp;|&nbsp; <span sec:authentication="name"></span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</nav>
<div th:fragment="footer"></div>
</body>
</html>
