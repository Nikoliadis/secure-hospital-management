<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${patient.id != null ? 'Edit Patient' : 'New Patient'}">Patient</title>
    <th:block th:replace="~{layout :: favicon}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <h1 th:text="${patient.id != null ? 'Edit Patient' : 'New Patient'}">Patient</h1>

    <form th:action="${patient.id != null ? '/patients/' + patient.id + '/edit' : '/patients/new'}"
          th:object="${patient}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label for="firstName">First Name *</label>
            <input type="text" id="firstName" th:field="*{firstName}" required maxlength="50"
                   pattern="[a-zA-ZͰ-Ͽἀ-῿ ]+" title="Letters only">
            <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
        </div>
        <div class="form-group">
            <label for="lastName">Last Name *</label>
            <input type="text" id="lastName" th:field="*{lastName}" required maxlength="50"
                   pattern="[a-zA-ZͰ-Ͽἀ-῿ ]+" title="Letters only">
            <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
        </div>
        <div class="form-group">
            <label for="amka">AMKA (11 digits) *</label>
            <input type="text" id="amka" th:field="*{amka}" required pattern="\d{11}" maxlength="11"
                   title="AMKA must be exactly 11 digits">
            <span class="field-error" th:if="${#fields.hasErrors('amka')}" th:errors="*{amka}"></span>
        </div>
        <div class="form-group">
            <label for="dateOfBirth">Date of Birth *</label>
            <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" required>
            <span class="field-error" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></span>
        </div>
        <div class="form-group">
            <label for="phone">Phone *</label>
            <input type="tel" id="phone" th:field="*{phone}" required maxlength="20"
                   pattern="[0-9+\-() ]{7,20}" title="Valid phone number">
            <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" maxlength="100">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Save</button>
            <a th:href="@{/patients}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
