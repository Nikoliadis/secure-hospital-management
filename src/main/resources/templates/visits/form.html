<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${visitId != null ? 'Edit Visit' : 'New Visit'}">Visit</title>
    <th:block th:replace="~{layout :: favicon}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <h1 th:text="${visitId != null ? 'Edit Visit' : 'Register New Visit'}">Visit</h1>

    <form th:action="${visitId != null ? '/visits/' + visitId + '/edit' : '/visits/new'}"
          th:object="${visitForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label>Patient *</label>
            <select th:field="*{patientId}" required>
                <option value="">-- Select Patient --</option>
                <option th:each="p : ${patients}"
                        th:value="${p.id}"
                        th:text="${p.lastName + ', ' + p.firstName + ' (' + p.amka + ')'}">
                </option>
            </select>
            <span class="field-error" th:if="${#fields.hasErrors('patientId')}" th:errors="*{patientId}"></span>
        </div>
        <div class="form-group">
            <label>Doctor *</label>
            <select th:field="*{doctorId}" required>
                <option value="">-- Select Doctor --</option>
                <option th:each="d : ${doctors}"
                        th:value="${d.id}"
                        th:text="${'Dr. ' + d.firstName + ' ' + d.lastName + ' - ' + d.specialty}">
                </option>
            </select>
            <span class="field-error" th:if="${#fields.hasErrors('doctorId')}" th:errors="*{doctorId}"></span>
        </div>
        <div class="form-group">
            <label>Visit Date &amp; Time *</label>
            <input type="datetime-local" th:field="*{visitDate}" required>
            <span class="field-error" th:if="${#fields.hasErrors('visitDate')}" th:errors="*{visitDate}"></span>
        </div>
        <div class="form-group">
            <label>Reason for Visit *</label>
            <textarea th:field="*{reason}" required maxlength="500" rows="3"></textarea>
            <span class="field-error" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></span>
        </div>
        <div class="form-group">
            <label>Diagnosis <small>(stored encrypted with AES-256)</small></label>
            <textarea th:field="*{diagnosis}" maxlength="2000" rows="4"></textarea>
            <small class="hint">Only the attending doctor and admin can decrypt and view this field.</small>
        </div>
        <div class="form-group">
            <label>Notes</label>
            <textarea th:field="*{notes}" maxlength="1000" rows="3"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Save Visit</button>
            <a th:href="@{/visits}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
