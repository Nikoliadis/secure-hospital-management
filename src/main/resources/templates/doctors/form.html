<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${doctor.id != null ? 'Edit Doctor' : 'New Doctor'}">Doctor</title>
    <th:block th:replace="~{layout :: favicon}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <h1 th:text="${doctor.id != null ? 'Edit Doctor' : 'New Doctor'}">Doctor</h1>

    <form th:action="${doctor.id != null ? '/doctors/' + doctor.id + '/edit' : '/doctors/new'}"
          th:object="${doctor}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label>First Name *</label>
            <input type="text" th:field="*{firstName}" required maxlength="50">
            <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
        </div>
        <div class="form-group">
            <label>Last Name *</label>
            <input type="text" th:field="*{lastName}" required maxlength="50">
            <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
        </div>
        <div class="form-group">
            <label>Specialty *</label>
            <input type="text" th:field="*{specialty}" required maxlength="100">
            <span class="field-error" th:if="${#fields.hasErrors('specialty')}" th:errors="*{specialty}"></span>
        </div>
        <div class="form-group">
            <label>License Number *</label>
            <input type="text" th:field="*{licenseNumber}" required maxlength="15"
                   pattern="[A-Z0-9]{5,15}" title="5-15 uppercase letters and digits">
            <span class="field-error" th:if="${#fields.hasErrors('licenseNumber')}" th:errors="*{licenseNumber}"></span>
        </div>
        <div class="form-group">
            <label>Phone *</label>
            <input type="tel" th:field="*{phone}" required maxlength="20">
            <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Save</button>
            <a th:href="@{/doctors}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
